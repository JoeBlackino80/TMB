{% extends "base.html" %}
{% block title %}Nastavenia — Romarium{% endblock %}
{% block content %}
<h1>Nastavenia</h1>
<div class="card">
  <form method="post" action="/settings">
    <label>Kam posielať prehľady a upozornenia</label>
    <input type="email" name="reminder_to" value="{{ settings['REMINDER_TO'] }}" required>
    <label>Heslá k chráneným PDF (výpisy z banky) — viac oddeľte čiarkou</label>
    <input name="pdf_passwords" value="{{ settings['PDF_PASSWORDS'] }}"
           placeholder="napr. rodné číslo alebo heslo z banky">
    <p class="muted">Heslo sa použije len lokálne na odomknutie PDF výpisov,
       aby Romarium vedelo samo odškrtnúť zaplatené platby.</p>
    <button type="submit">Uložiť</button>
  </form>
</div>
{% endblock %}
