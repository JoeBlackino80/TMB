<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romarium</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0;
         background: #f6f7f9; color: #1c1e21; }
  header { background: #14532d; color: #fff; padding: 14px 20px;
           display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  header b { font-size: 18px; }
  header a { color: #d1fae5; text-decoration: none; }
  header a:hover { color: #fff; }
  main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
          padding: 18px; margin-bottom: 16px; }
  h1 { font-size: 22px; } h2 { font-size: 17px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 14px; }
  input, select { width: 100%; max-width: 420px; padding: 9px; border: 1px solid #cbd5e1;
          border-radius: 7px; font-size: 15px; }
  button { background: #16a34a; color: #fff; border: 0; border-radius: 7px;
           padding: 10px 18px; font-size: 15px; cursor: pointer; margin-top: 12px; }
  button.small { padding: 5px 10px; font-size: 13px; margin: 0; background: #64748b; }
  .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
           padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f2; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 99px;
           font-size: 12px; font-weight: 700; }
  .b-green { background: #dcfce7; color: #166534; }
  .b-red { background: #fee2e2; color: #991b1b; }
  .b-amber { background: #fef3c7; color: #92400e; }
  .muted { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
<header>
  <b>💸 Romarium</b>
  {% if user %}
    <a href="/">Prehľad</a>
    <a href="/mailboxes">Schránky</a>
    <a href="/settings">Nastavenia</a>
    <a href="/billing">Predplatné</a>
    <span style="margin-left:auto" class="muted" >{{ user['email'] }}</span>
    <a href="/logout">Odhlásiť</a>
  {% endif %}
</header>
<main>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
