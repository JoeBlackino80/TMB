{% extends "base.html" %}
{% block title %}Nové heslo — Romarium{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:48px auto">
  <h1 style="margin-top:0">Nastavte si nové heslo</h1>
  <form method="post" action="/reset">
    <input type="hidden" name="t" value="{{ t }}">
    <label>Nové heslo (min. 8 znakov)</label>
    <input type="password" name="password" minlength="8" required
           autocomplete="new-password">
    <button type="submit">Uložiť heslo</button>
  </form>
</div>
{% endblock %}
