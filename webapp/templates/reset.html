{% extends "base.html" %}
{% block title %}{{ t.rp_title }} — VORU{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:48px auto">
  <h1 style="margin-top:0">{{ t.rp_title }}</h1>
  <form method="post" action="/reset">
    <input type="hidden" name="reset_token" value="{{ reset_token }}">
    <input type="hidden" name="lang" value="{{ lang or 'sk' }}">
    <label>{{ t.rp_pw }}</label>
    <input type="password" name="password" minlength="8" required
           autocomplete="new-password">
    <button type="submit">{{ t.rp_btn }}</button>
  </form>
</div>
{% endblock %}
