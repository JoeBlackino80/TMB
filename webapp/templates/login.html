{% extends "base.html" %}
{% block title %}Prihlásenie — Romarium{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:48px auto">
  <h1 style="margin-top:0">Prihlásenie</h1>
  <form method="post" action="/login">
    <label>E-mail</label>
    <input type="email" name="email" required autocomplete="email">
    <label>Heslo</label>
    <input type="password" name="password" required autocomplete="current-password">
    <button type="submit">Prihlásiť sa</button>
  </form>
  <p class="muted" style="margin-top:18px">Nemáte účet?
     <a href="/register">Registrujte sa</a> — 14 dní zadarmo.</p>
</div>
{% endblock %}
