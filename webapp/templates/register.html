{% extends "base.html" %}
{% block title %}Registrácia — Romarium{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:48px auto">
  <h1 style="margin-top:0">Vytvorte si účet</h1>
  <p class="muted">Romarium stráži vaše faktúry, platby a termíny.
     14 dní zadarmo — bez platobnej karty, potom 4,99 €/mesiac alebo 49 €/rok.</p>
  <form method="post" action="/register">
    <label>Používam Romarium ako</label>
    <div style="display:flex;gap:14px;margin:4px 0 6px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:7px;font-weight:500;margin:0">
        <input type="radio" name="account_type" value="business" checked
               style="width:auto"> firma / živnostník
      </label>
      <label style="display:flex;align-items:center;gap:7px;font-weight:500;margin:0">
        <input type="radio" name="account_type" value="personal"
               style="width:auto"> súkromná osoba
      </label>
      <label style="display:flex;align-items:center;gap:7px;font-weight:500;margin:0">
        <input type="radio" name="account_type" value="both"
               style="width:auto"> obidvoje
      </label>
    </div>
    <label>Váš e-mail (sem budú chodiť prehľady)</label>
    <input type="email" name="email" required autocomplete="email">
    <label>Heslo (min. 8 znakov)</label>
    <input type="password" name="password" minlength="8" required
           autocomplete="new-password">
    <button type="submit">Registrovať sa</button>
  </form>
  <p class="muted" style="margin-top:18px">Máte účet?
     <a href="/login">Prihláste sa</a></p>
</div>
{% endblock %}
