<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brand }} — flight reservation for visa &amp; onward travel</title>
<style>
  :root { --ink:#16213a; --mut:#5a6880; --acc:#1c64f2; --bg:#f5f7fb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
         color:#16213a; background:#f5f7fb; }
  header { background:#0d1b3d; color:#fff; padding:14px 20px; }
  header .wrap, main { max-width:860px; margin:0 auto; }
  header b { font-size:20px; letter-spacing:.5px; }
  main { padding:24px 20px 60px; }
  .card { background:#fff; border-radius:14px; padding:24px;
          box-shadow:0 2px 10px rgba(20,30,60,.07); margin-bottom:22px; }
  h1 { font-size:30px; margin:18px 0 8px; }
  h2 { font-size:20px; }
  p.lead { font-size:17px; color:#44506e; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
  input, select { width:100%; padding:10px 12px; border:1px solid #c8d2e4;
                  border-radius:8px; font-size:15px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:600px){ .row { grid-template-columns:1fr; } }
  button { margin-top:18px; width:100%; padding:13px; font-size:16px; font-weight:700;
           color:#fff; background:#1c64f2; border:0; border-radius:9px; cursor:pointer; }
  button:hover { background:#174fc4; }
  .note { font-size:13px; color:#5a6880; }
  .pnr { font-size:34px; font-weight:800; letter-spacing:6px; text-align:center; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid #e6ebf4; }
  .ok { color:#0a7d38; font-weight:700; }
  .bad { color:#b3261e; font-weight:700; }
  footer { text-align:center; font-size:12px; color:#8090a8; padding:20px; }
</style>
</head>
<body>
<header><div class="wrap"><b>✈ {{ brand }}</b></div></header>
<main>{% block content %}{% endblock %}</main>
<footer>{{ brand }} sells genuine, airline-verifiable flight reservations
(no ticket issued) for visa applications and proof of onward travel.
A reservation is not a flight ticket and cannot be used to board.</footer>
</body>
</html>
