{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:440px;margin:20px auto">
  <h2>{{ t['reset_title'] }}</h2>
  {% if err %}<p class="bad">{{ err }}</p>{% endif %}
  <form method="post" action="/reset">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="pw">{{ t['new_password'] }}</label>
    <input type="password" name="password" id="pw" minlength="10" maxlength="128" required autocomplete="new-password">
    {% include "_pwrules.html" %}
    <button type="submit">{{ t['reset_btn'] }}</button>
  </form>
</div>
{% endblock %}
