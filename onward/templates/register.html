{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:440px;margin:20px auto">
  <h2>{{ t['register_title'] }}</h2>
  <p class="note" style="margin:0 0 12px">{{ t['register_optional'] }}</p>
  {% if err %}<p class="bad">{{ err }}</p>{% endif %}
  {% include "_google.html" %}
  <form method="post" action="/register">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label for="reg-email">{{ t['email_lbl'] }}</label>
    <input type="email" id="reg-email" name="email" required autocomplete="email">
    <label for="pw">{{ t['password_lbl'] }}</label>
    <input type="password" name="password" id="pw" minlength="10" maxlength="128" required autocomplete="new-password">
    {% include "_pwrules.html" %}
    <div class="hp" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
    {% if turnstile_key %}<div class="cf-turnstile" data-sitekey="{{ turnstile_key }}" style="margin-top:14px"></div>{% endif %}
    <button type="submit">{{ t['register_btn'] }}</button>
  </form>
  <p class="note" style="margin-top:14px">{{ t['have_account'] }}
    <a href="/login{% if next %}?next={{ next }}{% endif %}">{{ t['login_btn'] }}</a></p>
</div>
{% endblock %}
