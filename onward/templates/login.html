{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:440px;margin:20px auto">
  <h2>{{ t['login_title'] }}</h2>
  {% if err %}<p class="bad">{{ err }}</p>{% endif %}
  <form method="post" action="/login">
    <label>{{ t['email_lbl'] }}</label>
    <input type="email" name="email" required>
    <label>{{ t['password_lbl'] }}</label>
    <input type="password" name="password" required>
    <div class="hp" aria-hidden="true"><input type="text" name="website"
         tabindex="-1" autocomplete="off"></div>
    {% if turnstile_key %}<div class="cf-turnstile" data-sitekey="{{ turnstile_key }}"
         style="margin-top:14px"></div>{% endif %}
    <button type="submit">{{ t['login_btn'] }}</button>
  </form>
  <p class="note" style="margin-top:14px">{{ t['no_account'] }}
    <a href="/register">{{ t['register_btn'] }}</a></p>
</div>
{% endblock %}
