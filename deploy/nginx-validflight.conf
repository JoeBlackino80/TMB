# Alternatíva ku Caddy, ak na serveri už beží nginx (certbot vybaví TLS):
#   cp deploy/nginx-validflight.conf /etc/nginx/sites-available/validflight
#   ln -s ../sites-available/validflight /etc/nginx/sites-enabled/
#   certbot --nginx -d validflight.com -d www.validflight.com
server {
    listen 80;
    server_name validflight.com www.validflight.com;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
